<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assents/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <script src="https://unpkg.com/lucide@latest"></script>
  <title>Hamburgueria</title>
</head>

<body>
  <nav class="navbar md:navbar-expand bg-1 ">
    <div class="container-fluid">
      <i data-lucide="hamburger"></i>
      <a class="navbar-brand" href="#">Hamburgueria</a>
      <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer"
        aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
      </button>
      <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
        <div class="drawer-header">
          <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
          <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
        </div>

        <div class="drawer-body mb-2 md:mb-0 ">
          <ul class="nav navbar-nav me-auto ">
            <li class="nav-item">
              <button id="button-car">
                <i data-lucide="shopping-cart"></i>
              </button>
            </li>
            <li class="nav-item">
              <a class="nav-link " href="#">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Cardapio</a>
            </li>
            <li>
              <a class="nav-link">diferenciais</a>
            </li>
            <li>
              <a class="nav-link">comentarios</a>
            </li>
            <li>
              <a class="nav-link">contato</a>
            </li>
            <li class="nav-item">
              <button id="button-fire">
                Fazer pedido
              </button>
            </li>
          </ul>
        </div>
      </dialog>
    </div>
  </nav>
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>
  <script>
    lucide.createIcons();
  </script>
</body>

</html>
